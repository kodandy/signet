version: 1
defaults:
  expires: "4h"

scope:
  filesystem:
    writable:
      - "./src/**"
      - "./test/**"
      - "./docs/**"
    readable:
      - "./**"
    blocked:
      - "./.env"
      - "./.env.*"
      - "~/.ssh/**"
      - "~/.aws/**"

  network:
    allow:
      - "github.com"
      - "registry.npmjs.org"
    deny:
      - "*"

  shell:
    deny:
      - "rm -rf *"
      - "sudo *"
      - "chmod 777 *"
      # データ送信・流出防止
      - "curl *"
      - "wget *"
      - "nc *"
      - "ncat *"
      - "netcat *"
      - "scp *"
      - "rsync *"
      - "ftp *"
      - "sftp *"
      # 環境変数・秘密の表示防止
      - "env"
      - "printenv *"
      - "cat /proc/*/environ"
      - "cat /proc/*/maps"
    ask:
      - "git push *"
      - "npm publish *"
